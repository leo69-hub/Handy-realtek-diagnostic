name: "Realtek diagnostic Windows x64"

on:
  workflow_dispatch:

jobs:
  windows-x64:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: --config src-tauri/tauri.realtek-diagnostic.conf.json
      sign-binaries: false
      upload-artifacts: true
      asset-prefix: handy-realtek-diagnostic
      no-cache: true
